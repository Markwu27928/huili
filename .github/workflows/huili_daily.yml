name: 匯立分點日報

on:
  schedule:
    - cron: "0 13 * * 1-5"    # 台灣時間 21:00（週一至週五）
    - cron: "30 15 * * 1-5"   # 台灣時間 23:30 補抓（資料已存在會自動略過）
  workflow_dispatch:           # 可在 Actions 頁面手動執行

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: huili-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install requests

      - name: 抓取並整理
        run: python huili_tracker.py

      - name: 提交資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/9A81 reports 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "沒有新資料"
          else
            git commit -m "匯立分點日報 $(TZ=Asia/Taipei date +%F)"
            git pull --rebase
            git push
          fi

      - name: 產生網頁
        run: python build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 發布網頁
        id: deploy
        uses: actions/deploy-pages@v4
